<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - login.html</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body class="form-page login-page">

  <div class="container">

    <header>
    <nav>
      <a href="index.html">Home</a>
      <span>|</span>
      <a href="addPost.html">addPost</a>
    </nav>

    <div class="profile-container">
      <div class="user-avatar" id="profile-pic" title="Profile">
        👤
      </div>
      <!--ülesanne 7: Dropdown menüü profiilipildi klikkimisel-->
      <!-- Rippmenüü (alguses peidetud klassiga 'hidden') -->
      <div id="dropdown-menu" class="dropdown-menu hidden">
        <p class="dropdown-name">Surfar Siim</p>
        <p class="dropdown-email">surfar.siim@ut.ee</p>
        <hr class="dropdown-divider">
        <a href="login.html" class="dropdown-logout">Logout</a>
      </div>
    </div>
  </header>

    <main>

      <div class="login-box">

        <h2>Welcome to PostIt</h2>

        <a href="signup.html">Create an account</a>

        <p class="or-text">or</p>

        <p class="login-text">Please log in</p>

        <form action="index.html">

          <input
            type="email"
            placeholder="Email"
            required
          >

          <br>

          <input
            type="password"
            placeholder="Password"
            required
          >

          <br>

          <div class="login-button-container">
            <button type="submit" class="login-button">
              Log in
            </button>
          </div>

        </form>

        <a href="#">Forget password</a>

      </div>

    </main>

  </div>

</body>
</html>
