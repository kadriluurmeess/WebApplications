<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add post - addPost.html</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="form-page add-post-page">

  <div class="container">

    <header>
      <nav>
        <a href="index.html">Home</a>
      </nav>

      <a href="login.html" class="user-avatar">
        👤
      </a>
    </header>

    <main>

      <form class="post-form" action="index.html">

        <div class="form-row">
          <label for="postBody">
            Post<br>body
          </label>

          <textarea
            id="postBody"
            name="postBody"
            placeholder="textarea"
          ></textarea>
        </div>

        <div class="form-row">
          <label for="file">
            Select<br>file
          </label>

          <input
            type="file"
            id="file"
            name="file"
          >
        </div>

        <button class="create-button" type="submit">
          Create post
        </button>

      </form>

    </main>

  </div>

</body>
</html>
